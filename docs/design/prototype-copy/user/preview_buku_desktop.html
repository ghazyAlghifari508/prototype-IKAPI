<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="web_standard" name="shell-type">
  <title>Cuplikan: Laskar Aksara Pasundan — IKAPI Store Jawa Barat</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <!-- Typography: DM Sans for UI & Literata for long editorial reading -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    :root {
      --color-primary: #673de6;
      --color-primary-hover: #5025d1;
      --color-primary-deep: #2f1c6a;
      --color-canvas: #ffffff;
      --color-surface-soft: #f5f6ff;
      --color-surface-neutral: #f5f5f6;
      --color-text-primary: #222225;
      --color-text-secondary: #62636b;
      --color-border: #e5e7eb;
    }
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        background-color: #f5f5f6;
        color: #222225;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        overflow-x: clip;
      }
      main > :first-child {
        margin-top: 0 !important;
      }
      main > :last-child {
        margin-bottom: 0 !important;
      }
    }
    .font-reading {
      font-family: 'Literata', Georgia, serif;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: "#673de6",
              hover: "#5025d1",
              deep: "#2f1c6a",
              container: "#673de6",
              accent: "#9d99ff"
            },
            surface: {
              DEFAULT: "#ffffff",
              soft: "#f5f6ff",
              neutral: "#f5f5f6",
              border: "#e5e7eb"
            },
            ink: {
              body: "#222225",
              muted: "#62636b",
              subtle: "#9d9ea4"
            },
            "border-subtle": "#e5e7eb",
            "border-bold": "#d1d5db"
          },
          fontFamily: {
            sans: ["'DM Sans'", "sans-serif"],
            body: ["'DM Sans'", "sans-serif"],
            reading: ["'Literata'", "Georgia", "serif"]
          },
          borderRadius: {
            '2xl': '1rem',
            '3xl': '1.5rem',
            '4xl': '1.75rem'
          }
        }
      }
    };
  </script>
</head>
<body class="bg-white font-sans text-ink-body antialiased selection:bg-surface-soft selection:text-primary-deep min-h-screen flex flex-col justify-between py-6 sm:py-10">

  <!-- READING SURFACE (Zero Navbar, Zero Footer, Pure White Canvas) -->
  <main class="w-full flex-1 flex flex-col items-center justify-center px-4 sm:px-6">
    <div class="w-full max-w-[760px] flex flex-col items-stretch space-y-6">
      
      <!-- Top Clean Back Navigation -->
      <div class="flex items-center">
        <a href="detail_buku_desktop.html" data-path="detail-buku" class="inline-flex items-center gap-1.5 text-ink-muted hover:text-primary text-[13.5px] font-semibold transition-colors">
          <span class="material-symbols-outlined text-[18px]">arrow_back</span>
          <span>Kembali ke Detail Buku</span>
        </a>
      </div>

      <!-- Reading Article Surface (Directly on white canvas, zero border box) -->
      <article id="reader-content" class="w-full bg-white transition-opacity duration-200 scroll-mt-24">
        <!-- Content injected dynamically by renderPage() -->
      </article>

      <!-- Preview Progress Indicator (Cuplikan X dari Y semantics) -->
      <div class="flex flex-col items-center justify-center gap-2 pt-2">
        <span class="text-[13.5px] font-bold text-ink-body" id="preview-counter-badge">
          Cuplikan 1 dari 4
        </span>
        <div class="w-44 h-2 bg-surface-neutral rounded-full overflow-hidden border border-border-subtle shadow-xs">
          <div id="preview-progress-bar" class="h-full bg-primary rounded-full transition-all duration-300" style="width: 25%;"></div>
        </div>
      </div>

      <!-- Controls Bar: Prev/Next & Integrated Purchase CTA (Cleanly unwrapped) -->
      <div class="w-full pt-4 border-t border-border-subtle flex flex-col sm:flex-row items-center justify-between gap-4">
        
        <!-- Navigation Buttons -->
        <div class="flex items-center gap-2.5 w-full sm:w-auto justify-between sm:justify-start">
          <button id="btn-prev" type="button" class="flex-1 sm:flex-initial h-10 px-4 rounded-xl border border-border-subtle bg-surface-neutral hover:bg-surface-soft hover:text-primary text-ink-body text-[13px] sm:text-[14px] font-bold flex items-center justify-center gap-1 transition-colors disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer" onclick="goToPage(currentPageIndex - 1)">
            <span class="material-symbols-outlined text-[18px]">chevron_left</span>
            <span>Sebelumnya</span>
          </button>

          <button id="btn-next" type="button" class="flex-1 sm:flex-initial h-10 px-4 rounded-xl border border-border-subtle bg-surface-neutral hover:bg-surface-soft hover:text-primary text-ink-body text-[13px] sm:text-[14px] font-bold flex items-center justify-center gap-1 transition-colors disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer" onclick="goToPage(currentPageIndex + 1)">
            <span>Berikutnya</span>
            <span class="material-symbols-outlined text-[18px]">chevron_right</span>
          </button>
        </div>

        <!-- Purchase Action Button (Hostinger Primary Solid Purple) -->
        <div class="w-full sm:w-auto">
          <button id="btnAddToCart" type="button" class="w-full sm:w-auto h-10 px-5 rounded-xl bg-primary hover:bg-primary-hover text-white text-[13px] sm:text-[14px] font-bold flex items-center justify-center gap-2 transition-all shadow-xs cursor-pointer active:scale-[0.99]" onclick="handleAddToCartClick(event)">
            <span class="material-symbols-outlined text-[18px]">shopping_bag</span>
            <span id="btnAddToCartText">Beli Buku Penuh (Rp 45.000)</span>
          </button>
        </div>

      </div>

    </div>
  </main>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2.5 px-4 py-3 rounded-2xl bg-ink-body text-white shadow-xl text-[14px] font-medium border border-white/10">
    <span class="material-symbols-outlined text-primary-accent text-[20px]">check_circle</span>
    <span id="toast-message">Buku berhasil ditambahkan ke keranjang</span>
  </div>

  <!-- CLIENT SCRIPTS -->
  <script>
    const samplePages = [
      {
        num: 1,
        chapter: "Bab 1",
        title: "Jejak Aksara di Kaki Gunung Manglayang",
        paragraphs: [
          "Kabut tipis masih merayap lambat di lembah Palasari saat fajar memecah siluet Gunung Manglayang. Hawa dingin khas dataran tinggi Bandung Timur menusuk hingga ke serat benang jaket rajut yang kukenakan. Di hadapanku, sebuah peti kayu jati berukir sulur daun sirih teronggok di sudut surau tua berdinding sasak bambu.",
          "Wangi minyak cengkeh menguar seketika kait kuningan peti tersebut berderit terbuka, menandai pertemuan pertamaku dengan lembaran lontar yang nyaris dilupakan peradaban zaman modern.",
          "Pak Tua Rusdi menyeka kacamata bundarnya dengan ujung sarung poleng. Tangannya yang bergetar hati-hati membuka helaian kain mori putih pembalut naskah kuno tersebut. Guratan aksara Sunda Buhun tampak hitam legam, terukir menggunakan pisau pangot dengan presisi yang mencengangkan bagi siapa pun yang memahaminya.",
          "“Ini naskah titipan karuhun, Cep Dani,” tutur Pak Rusdi serak namun sarat ketakziman. “Disimpan turun-temurun sejak kakek buyut saya bertugas sebagai juru rawat naskah di kawasan lereng timur. Dulu, para sesepuh membacanya dengan tembang pupuh setiap kali musim tanam padi dan panen raya tiba.”",
          "Aku mendekatkan lampu senter kecil ke permukaan daun tal. Serat-serat alaminya masih kokoh meski tepiannya mulai rapuh dimakan usia. Huruf-huruf bersudut tegas itu seolah hidup, mengisahkan kembali peristiwa ratusan tahun silam ketika para juru tulis mandala menggoreskan catatan di tengah keheningan pertapaan lereng gunung.",
          "Catatan kecil di ujung lempir lontar menunjukkan penanggalan candrasangkala yang dipadankan dengan abad ke-16 Masehi. Rasa kagum bercampur getar tanggung jawab bergolak di dadaku; kami bukan sekadar menemukan artefak tua, melainkan membuka kembali gerbang dialog dengan peradaban masa lalu yang sarat kearifan ekologis."
        ]
      },
      {
        num: 2,
        chapter: "Bab 1",
        title: "Aroma Daluwang dan Jejak Masa Lalu",
        paragraphs: [
          "“Naskah ieu sanes saukur guratan aksara, Cep,” bisik Pak Rusdi perlahan, netranya menatap lurus ke arah kabut yang perlahan tersibak sinar mentari pagi di ufuk timur. “Ieu mangrupikeun napas jeung kearifan kumaha karuhun urang ngajaga leuweung, cai, jeung martabat bangsa.”",
          "Aku menahan napas seraya menyentuh tepi daun tal yang kering itu. Dinginnya permukaan lontar seolah menghantarkan getaran ketabahan para juru tulis masa silam yang mendedikasikan hidupnya demi merawat ingatan bersama.",
          "Di luar surau, suara gemericik aliran sungai kecil membelah kebun bambu. Lembur ini tampak begitu tenang, seakan terisolasi dari keriuhan kota Bandung yang berjarak hanya puluhan kilometer di sebelah barat.",
          "Selain lempir lontar beraksara Sunda kuno, di dasar peti itu terselip beberapa lembar kertas daluwang cokelat keemasan. Teksturnya berserat kasar khas kulit pohon saeh yang ditempa berulang kali di atas landasan batu kali, dengan tinta jelaga damar yang masih berkilau pekat.",
          "“Daluwang ini memuat petuah tata kelola air dan batas wilayah leuweung larangan,” tambah Pak Rusdi seraya menunjuk sketsa peta kuno bertinta merah mangsi. “Orang tua baheula tak pernah berani menebang pohon sembarangan karena hukum adatnya terpahat jelas di lembaran ini. Jika hulu sungai dirusak, niscaya petaka kemarau panjang akan menimpa seisi lembah.”",
          "Aku membuka kamera dokumentasi dan meletakkan meteran ukur kalibrasi warna di samping naskah daluwang. Proses alih wahana digital ini terasa sakral; setiap bidikan resolusi tinggi adalah ikhtiar memastikan bahwa bait-bait petuah leluhur Pasundan tak akan lenyap ditelan pelapukan zaman."
        ]
      },
      {
        num: 3,
        chapter: "Bab 2",
        title: "Prasasti Kawali dan Rahasia Pasangan",
        paragraphs: [
          "Perjalanan kami berlanjut menuju kawasan cagar budaya Astana Gede di Kawali. Deretan batu tegak berlumut menaungi kompleks yang dahulu menjadi pusat peradaban Galuh. Udara lembap hutan larangan menyambut derap langkah kami yang kian melambat.",
          "Di atas permukaan batu andesit kelabu, guratan kalimat pembuka prasasti terpatri tegas: 'Aya ma nu ngarep-ngarep karahayuan, hayu pake tindak utama...' Pesan moral luhur itu seakan tak pernah lekang oleh waktu.",
          "Dani, mahasiswa filologi yang menemaniku, membuka buku catatannya dengan antusias. Setiap lekuk aksara dipetakan secara teliti ke dalam sistem dokumentasi digital, menghubungkan masa silam dengan peradaban modern.",
          "Kami mengamati teknik pahatan relief aksara yang begitu halus. Berbeda dengan naskah daun lontar, pahatan batu Kawali memiliki proporsi tegak dan proporsional, mencerminkan kedewasaan tradisi literasi keraton Galuh pada masa kepemimpinan Prabu Niskala Wastu Kancana.",
          "“Perhatikan tanda vokalisasi panyecek dan panglayar di baris ketiga,” bisik Dani sambil membandingkan foto makro dengan tabel aksara baku. “Sistem fonetik yang mereka susun telah mencapai tingkat ketelitian tata bahasa yang sangat matang, menandakan tingginya peradaban tulis tatar Sunda pada masa itu.”",
          "Hembusan angin pegunungan menerbangkan dedaunan kering di atas pelataran batu prasasti. Di tempat hening inilah kami menyadari bahwa prasasti batu ini bukanlah monumen penaklukan, melainkan piagam etika kemanusiaan yang menuntun para pemimpin agar senantiasa berbuat kebajikan bagi rakyatnya."
        ]
      },
      {
        num: 4,
        chapter: "Bab 2",
        title: "Menjaga Denyut Naskah Nusantara",
        paragraphs: [
          "Menjelang petang, hujan rintik-rintik mulai membasahi dedaunan mahoni di pelataran situs. Kami berteduh di bawah cungkup prasasti, menyaksikan bagaimana aksara kuno ini tetap tegak berdiri meski ratusan musim telah berganti.",
          "Perjalanan ini bukan sekadar pencarian naskah tua, melainkan ikhtiar memahami bagaimana kearifan lokal dapat terus memberi inspirasi bagi generasi yang hidup di era serba cepat.",
          "Setiap baris kalimat dalam lembaran lontar dan pahatan batu mengajarkan satu hal mendasar: martabat suatu peradaban tercermin dari kesungguhannya menjaga warisan ilmu dan aksaranya.",
          "Saat layar laptop dinyalakan kembali di bawah temaram lampu surau Kawali, deretan aksara digital hasil pemindaian berpendar terang di hadapan kami. Pertemuan antara batu prasasti abad pertengahan dan piksel layar Web Reader modern melahirkan jembatan kebudayaan baru yang mengharukan.",
          "“Jika naskah-naskah ini hanya tersimpan di ruang museum tertutup, lambat laun mereka akan sunyi dan terlupakan,” tutur Dani seraya merapikan berkas transliterasi. “Namun ketika generasi muda dapat membaca cuplikan naskahnya langsung lewat gawai dengan kenyamanan tipografi hari ini, denyut kearifan itu akan terus hidup di sanubari mereka.”",
          "Kami beranjak melangkah pulang meninggalkan kompleks cagar budaya saat gema genta senja menyatu dengan kabut kaki gunung. Di dalam media penyimpanan kami kini tersimpan rekaman digital berharga yang siap dibagikan kepada seluruh pembaca dan pegiat literasi di tanah air."
        ]
      }
    ];

    const totalPages = samplePages.length;
    let currentPageIndex = 0; // 0-indexed (0..3)

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      if (!toast || !toastMessage) return;
      toastMessage.textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
      }, 2500);
    }

    function renderPage(index) {
      const page = samplePages[index];
      const contentEl = document.getElementById('reader-content');
      const counterBadge = document.getElementById('preview-counter-badge');
      const progressBar = document.getElementById('preview-progress-bar');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');

      if (!page || !contentEl) return;

      const isLastPage = index === totalPages - 1;

      const paragraphsHtml = page.paragraphs
        .map(p => `<p class="font-reading text-[17px] sm:text-[18px] text-ink-body leading-[1.85] text-left">${p}</p>`)
        .join('');

      // Editorial end-of-preview box (only on last page)
      const endOfPreviewHtml = isLastPage ? `
        <div class="mt-8 pt-6 border-t border-border-subtle bg-surface-neutral p-6 rounded-2xl space-y-3 animate-in fade-in duration-300">
          <div class="flex items-center gap-2 text-primary font-bold text-[13px] uppercase tracking-wider">
            <span class="material-symbols-outlined text-[18px]">verified</span>
            <span>Akhir Cuplikan Buku</span>
          </div>
          <p class="text-[14px] text-ink-body leading-relaxed">
            Kamu telah mencapai akhir cuplikan gratis <strong>Laskar Aksara Pasundan</strong>. Lanjutkan membaca seluruh 268 halaman dengan membeli lisensi e-book resmi di IKAPI Store Jawa Barat.
          </p>
        </div>
      ` : '';

      contentEl.innerHTML = `
        <div class="mb-6 pb-4 border-b border-border-subtle">
          <span class="text-primary font-bold text-[12px] sm:text-[13px] uppercase tracking-wider block mb-1">${page.chapter}</span>
          <h2 class="text-[24px] sm:text-[28px] font-bold text-ink-body tracking-tight leading-tight">
            ${page.title}
          </h2>
        </div>
        <div class="space-y-5">
          ${paragraphsHtml}
        </div>
        ${endOfPreviewHtml}
      `;

      if (counterBadge) {
        counterBadge.textContent = `Cuplikan ${page.num} dari ${totalPages}`;
      }
      if (progressBar) {
        progressBar.style.width = `${(page.num / totalPages) * 100}%`;
      }

      if (btnPrev) btnPrev.disabled = index === 0;
      if (btnNext) btnNext.disabled = isLastPage;
    }

    function goToPage(index) {
      if (index < 0 || index >= totalPages) return;
      currentPageIndex = index;
      renderPage(currentPageIndex);
      
      const contentEl = document.getElementById('reader-content');
      if (contentEl) {
        contentEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    // Keyboard navigation (ArrowLeft & ArrowRight)
    document.addEventListener('keydown', (e) => {
      // Ignore if user is inside form input or textarea
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;

      if (e.key === 'ArrowLeft') {
        goToPage(currentPageIndex - 1);
      } else if (e.key === 'ArrowRight') {
        goToPage(currentPageIndex + 1);
      }
    });

    // Add to Cart Interaction
    function handleAddToCartClick(e) {
      if (e) e.preventDefault();
      const btn = document.getElementById('btnAddToCart');
      const btnText = document.getElementById('btnAddToCartText');

      if (btnText) {
        btnText.textContent = 'Ditambahkan ke Keranjang';
        btn.classList.add('bg-primary-hover');
        setTimeout(() => {
          btnText.textContent = 'Beli Buku Penuh (Rp 45.000)';
          btn.classList.remove('bg-primary-hover');
        }, 1800);
      }
      showToast('Laskar Aksara Pasundan ditambahkan ke keranjang');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderPage(currentPageIndex);
    });
  </script>
</body>
</html>
