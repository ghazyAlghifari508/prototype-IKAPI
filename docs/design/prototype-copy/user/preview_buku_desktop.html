<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="web_standard" name="shell-type">
  <title>Cuplikan: Laskar Aksara Pasundan — IKAPI Store Jawa Barat</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
      }
      body {
        overflow-x: clip;
      }
      main > :first-child {
        margin-top: 0 !important;
      }
      main > :last-child {
        margin-bottom: 0 !important;
      }
    }
    .font-reading {
      font-family: 'Literata', Georgia, serif;
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-error": "#ffffff",
            "secondary-fixed": "#ffd9e3",
            "surface-sky": "#E0F6FC",
            "feedback-error": "#B42318",
            "surface-tint": "#4c48dc",
            "on-surface": "#1b1b25",
            "on-secondary": "#ffffff",
            "primary-container": "#5956e9",
            "primary-fixed-dim": "#c2c1ff",
            "tertiary": "#745b00",
            "outline-variant": "#c7c4d7",
            "on-primary": "#ffffff",
            "on-error-container": "#93000a",
            "surface-lilac": "#E5E4FF",
            "tertiary-fixed": "#ffe08d",
            "inverse-surface": "#302f3a",
            "secondary": "#815060",
            "on-primary-fixed": "#0c006a",
            "on-tertiary-container": "#4f3d00",
            "error": "#ba1a1a",
            "on-secondary-container": "#7a495a",
            "surface-bright": "#fcf8ff",
            "surface-dim": "#dbd8e7",
            "on-tertiary-fixed": "#241a00",
            "primary": "#3f3ad0",
            "ink-body": "#191923",
            "inverse-on-surface": "#f2effe",
            "on-background": "#1b1b25",
            "surface-variant": "#e3e1ef",
            "ink-muted": "#555665",
            "outline": "#777586",
            "surface-container-high": "#e9e6f5",
            "on-secondary-fixed-variant": "#663949",
            "secondary-fixed-dim": "#f4b5c8",
            "border-bold": "#CFD0DD",
            "background": "#fcf8ff",
            "on-secondary-fixed": "#330e1d",
            "inverse-primary": "#c2c1ff",
            "error-container": "#ffdad6",
            "surface-container-highest": "#e3e1ef",
            "tertiary-fixed-dim": "#ecc23f",
            "surface": "#fcf8ff",
            "surface-soft": "#F8F7FF",
            "on-primary-container": "#eeeaff",
            "inverse-deep": "#24233D",
            "surface-cream": "#FFF1E3",
            "surface-container": "#efecfb",
            "surface-paper": "#FFF0E3",
            "tertiary-container": "#cea623",
            "on-tertiary-fixed-variant": "#584400",
            "on-primary-fixed-variant": "#3229c4",
            "surface-container-low": "#f5f2ff",
            "on-surface-variant": "#464555",
            "surface-container-lowest": "#ffffff",
            "border-subtle": "#E7E7EF",
            "secondary-container": "#fdbed1",
            "primary-fixed": "#e2dfff",
            "on-tertiary": "#ffffff"
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            "2xl": "1rem",
            full: "9999px"
          },
          spacing: {
            "margin": "2.5rem",
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "1rem",
            "space-lg": "1.5rem",
            "space-xl": "2rem",
            "space-2xl": "3rem",

          },
          fontFamily: {
            "body-base": ["Plus Jakarta Sans", "sans-serif"],
            "body-small": ["Plus Jakarta Sans", "sans-serif"],
            "label": ["Plus Jakarta Sans", "sans-serif"],
            "label-small": ["Plus Jakarta Sans", "sans-serif"],
            "title-md": ["Plus Jakarta Sans", "sans-serif"],
            "headline-md": ["Plus Jakarta Sans", "sans-serif"],
            "headline-lg": ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body-base text-ink-body antialiased min-h-screen flex flex-col justify-between">

  <!-- DEDICATED READER HEADER -->
  <header class="sticky top-0 left-0 right-0 z-30 bg-surface-container-lowest/95 backdrop-blur-sm border-b border-border-subtle shadow-xs">
    <div class="max-w-[1040px] mx-auto px-4 md:px-margin h-16 flex items-center justify-between gap-4">
      <!-- Back Navigation -->
      <a href="detail_buku_desktop.html" data-path="detail-buku" class="inline-flex items-center gap-1.5 text-ink-body hover:text-primary font-label text-[14px] font-semibold transition-colors shrink-0">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        <span>Kembali</span>
      </a>

      <!-- Center Title -->
      <div class="flex flex-col items-center text-center min-w-0">
        <h1 class="font-title-md text-[15px] md:text-[17px] font-bold text-ink-body truncate max-w-[280px] sm:max-w-md">
          Laskar Aksara Pasundan
        </h1>
        <span class="text-[12px] font-body-small text-ink-muted">Cuplikan Buku</span>
      </div>

      <!-- Right Action: Return to Book Detail -->
      <div class="shrink-0 flex items-center gap-2">
        <a href="detail_buku_desktop.html" data-path="detail-buku" class="hidden sm:inline-flex items-center text-[13px] font-label font-medium text-ink-muted hover:text-primary transition-colors">
          Detail Buku
        </a>
      </div>
    </div>
  </header>

  <!-- READING SURFACE -->
  <main class="w-full flex-1 flex flex-col items-center py-space-xl px-4 sm:px-6">
    <div class="w-full max-w-[760px] flex flex-col items-stretch">
      
      <!-- Reading Article -->
      <article id="reader-content" class="w-full bg-surface-container-lowest rounded-2xl p-6 sm:p-10 md:p-12 border border-border-subtle shadow-xs transition-opacity duration-200">
        <!-- Content will be injected dynamically by JavaScript -->
      </article>

      <!-- 1. Dedicated Page Counter & Reading Progress -->
      <div class="mt-space-lg flex flex-col items-center justify-center gap-1.5 py-1">
        <span class="font-label text-[14px] font-semibold text-ink-body" id="page-counter-badge">
          Halaman 1 dari 4
        </span>
        <div class="w-36 h-1.5 bg-surface-container rounded-full overflow-hidden">
          <div id="page-progress-bar" class="h-full bg-primary rounded-full transition-all duration-300" style="width: 25%;"></div>
        </div>
      </div>

      <!-- 2. Controls Bar: Next/Prev & Payment Together -->
      <div class="mt-space-md w-full bg-surface-container-lowest rounded-xl p-3 sm:p-space-md border border-border-subtle shadow-xs flex flex-col sm:flex-row items-center justify-between gap-space-sm">
        <!-- Navigation Buttons -->
        <div class="flex items-center gap-2.5 w-full sm:w-auto justify-between sm:justify-start">
          <button id="btn-prev" type="button" class="flex-1 sm:flex-initial h-10 px-4 rounded-lg border border-border-bold bg-surface-container-lowest hover:bg-surface-soft text-ink-body font-label text-[13px] sm:text-[14px] font-semibold flex items-center justify-center gap-1.5 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
            <span class="material-symbols-outlined text-[18px]">chevron_left</span>
            <span>Sebelumnya</span>
          </button>

          <button id="btn-next" type="button" class="flex-1 sm:flex-initial h-10 px-4 rounded-lg border border-border-bold bg-surface-container-lowest hover:bg-surface-soft text-ink-body font-label text-[13px] sm:text-[14px] font-semibold flex items-center justify-center gap-1.5 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
            <span>Berikutnya</span>
            <span class="material-symbols-outlined text-[18px]">chevron_right</span>
          </button>
        </div>

        <!-- Payment CTA Button -->
        <div class="w-full sm:w-auto">
          <button id="btnAddToCart" type="button" class="w-full sm:w-auto h-10 px-5 rounded-lg bg-primary-container hover:bg-surface-tint text-on-primary font-label text-[13px] sm:text-[14px] font-semibold flex items-center justify-center gap-2 transition-colors shadow-xs">
            <span class="material-symbols-outlined text-[18px]">shopping_bag</span>
            <span id="btnAddToCartText">Tambah ke Keranjang (Rp 45.000)</span>
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-16 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2 px-4 py-3 rounded-xl bg-ink-body text-surface shadow-lg text-[14px] font-label font-medium">
    <span class="material-symbols-outlined text-primary-fixed text-[20px]">check_circle</span>
    <span id="toast-message">Buku berhasil ditambahkan ke keranjang</span>
  </div>

  <!-- CLIENT SCRIPTS -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const samplePages = [
        {
          num: 1,
          chapter: "Bab 1",
          title: "Jejak Aksara di Kaki Gunung Manglayang",
          paragraphs: [
            "Kabut tipis masih merayap lambat di lembah Palasari saat fajar memecah siluet Gunung Manglayang. Hawa dingin khas dataran tinggi Bandung Timur menusuk hingga ke serat benang jaket rajut yang kukenakan. Di hadapanku, sebuah peti kayu jati berukir sulur daun sirih teronggok di sudut surau tua berdinding sasak bambu.",
            "Wangi minyak cengkeh menguar seketika kait kuningan peti tersebut berderit terbuka, menandai pertemuan pertamaku dengan lembaran lontar yang nyaris dilupakan peradaban zaman modern.",
            "Pak Tua Rusdi menyeka kacamata bundarnya dengan ujung sarung poleng. Tangannya yang bergetar hati-hati membuka helaian kain mori putih pembalut naskah kuno tersebut. Guratan aksara Sunda Buhun tampak hitam legam, terukir menggunakan pisau pangot dengan presisi yang mencengangkan bagi siapa pun yang memahaminya."
          ]
        },
        {
          num: 2,
          chapter: "Bab 1",
          title: "Aroma Daluwang dan Jejak Masa Lalu",
          paragraphs: [
            "“Naskah ieu sanes saukur guratan aksara, Cep,” bisik Pak Rusdi perlahan, netranya menatap lurus ke arah kabut yang perlahan tersibak sinar mentari pagi di ufuk timur. “Ieu mangrupikeun napas jeung kearifan kumaha karuhun urang ngajaga leuweung, cai, jeung martabat bangsa.”",
            "Aku menahan napas seraya menyentuh tepi daun tal yang kering itu. Dinginnya permukaan lontar seolah menghantarkan getaran ketabahan para juru tulis masa silam yang mendedikasikan hidupnya demi merawat ingatan bersama.",
            "Di luar surau, suara gemericik aliran sungai kecil membelah kebun bambu. Lembur ini tampak begitu tenang, seakan terisolasi dari keriuhan kota Bandung yang berjarak hanya puluhan kilometer di sebelah barat."
          ]
        },
        {
          num: 3,
          chapter: "Bab 2",
          title: "Prasasti Kawali dan Rahasia Pasangan",
          paragraphs: [
            "Perjalanan kami berlanjut menuju kawasan cagar budaya Astana Gede di Kawali. Deretan batu tegak berlumut menaungi kompleks yang dahulu menjadi pusat peradaban Galuh. Udara lembap hutan larangan menyambut derap langkah kami yang kian melambat.",
            "Di atas permukaan batu andesit kelabu, guratan kalimat pembuka prasasti terpatri tegas: 'Aya ma nu ngarep-ngarep karahayuan, hayu pake tindak utama...' Pesan moral luhur itu seakan tak pernah lekang oleh waktu.",
            "Dani, mahasiswa filologi yang menemaniku, membuka buku catatannya dengan antusias. Setiap lekuk aksara dipetakan secara teliti ke dalam sistem dokumentasi digital, menghubungkan masa silam dengan peradaban modern."
          ]
        },
        {
          num: 4,
          chapter: "Bab 2",
          title: "Menjaga Denyut Naskah Nusantara",
          paragraphs: [
            "Menjelang petang, hujan rintik-rintik mulai membasahi dedaunan mahoni di pelataran situs. Kami berteduh di bawah cungkup prasasti, menyaksikan bagaimana aksara kuno ini tetap tegak berdiri meski ratusan musim telah berganti.",
            "Perjalanan ini bukan sekadar pencarian naskah tua, melainkan ikhtiar memahami bagaimana kearifan lokal dapat terus memberi inspirasi bagi generasi yang hidup di era serba cepat.",
            "Setiap baris kalimat dalam lembaran lontar dan pahatan batu mengajarkan satu hal mendasar: martabat suatu peradaban tercermin dari kesungguhannya menjaga warisan ilmu dan aksaranya."
          ]
        }
      ];

      const totalPages = samplePages.length;
      let currentPageIndex = 0; // Starts from Page 1 (0-indexed)

      const contentEl = document.getElementById('reader-content');
      const counterBadge = document.getElementById('page-counter-badge');
      const progressBar = document.getElementById('page-progress-bar');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const btnAddToCart = document.getElementById('btnAddToCart');
      const btnAddToCartText = document.getElementById('btnAddToCartText');
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');

      let toastTimer = null;
      function showToast(msg) {
        if (!toast || !toastMessage) return;
        toastMessage.textContent = msg;
        toast.classList.remove('translate-y-16', 'opacity-0', 'pointer-events-none');
        toast.classList.add('translate-y-0', 'opacity-100');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('translate-y-0', 'opacity-100');
          toast.classList.add('translate-y-16', 'opacity-0', 'pointer-events-none');
        }, 2500);
      }

      function renderPage(index) {
        const page = samplePages[index];
        if (!page) return;

        let paragraphsHtml = page.paragraphs
          .map(p => `<p class="font-reading text-[17px] sm:text-[18px] text-ink-body leading-[1.8] text-left">${p}</p>`)
          .join('');

        contentEl.innerHTML = `
          <div class="mb-space-lg pb-space-md border-b border-border-subtle">
            <span class="text-primary font-bold text-[13px] uppercase tracking-wider block mb-1">${page.chapter}</span>
            <h2 class="font-headline-md text-[24px] sm:text-[28px] font-bold text-ink-body tracking-tight leading-tight">
              ${page.title}
            </h2>
          </div>
          <div class="space-y-5">
            ${paragraphsHtml}
          </div>
        `;

        if (counterBadge) {
          counterBadge.textContent = `Halaman ${page.num} dari ${totalPages}`;
        }
        if (progressBar) {
          progressBar.style.width = `${(page.num / totalPages) * 100}%`;
        }

        if (btnPrev) btnPrev.disabled = index === 0;
        if (btnNext) btnNext.disabled = index === totalPages - 1;
      }

      function goToPage(index) {
        if (index < 0 || index >= totalPages) return;
        currentPageIndex = index;
        renderPage(currentPageIndex);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      if (btnPrev) {
        btnPrev.addEventListener('click', () => goToPage(currentPageIndex - 1));
      }

      if (btnNext) {
        btnNext.addEventListener('click', () => goToPage(currentPageIndex + 1));
      }

      // Keyboard navigation (ArrowLeft & ArrowRight)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
          goToPage(currentPageIndex - 1);
        } else if (e.key === 'ArrowRight') {
          goToPage(currentPageIndex + 1);
        }
      });

      // Add to cart interaction
      if (btnAddToCart) {
        btnAddToCart.addEventListener('click', (e) => {
          e.preventDefault();
          if (btnAddToCartText) {
            btnAddToCartText.textContent = 'Ditambahkan ke Keranjang';
            btnAddToCart.classList.remove('bg-primary-container', 'hover:bg-surface-tint');
            btnAddToCart.classList.add('bg-primary');
            setTimeout(() => {
              btnAddToCartText.textContent = 'Tambah ke Keranjang (Rp 45.000)';
              btnAddToCart.classList.remove('bg-primary');
              btnAddToCart.classList.add('bg-primary-container', 'hover:bg-surface-tint');
            }, 1800);
          }
          showToast('Laskar Aksara Pasundan ditambahkan ke keranjang');
        });
      }

      // Initialize first page
      renderPage(currentPageIndex);
    });
  </script>
</body>
</html>
