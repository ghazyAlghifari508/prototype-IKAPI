<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="web_standard" name="shell-type">
  <title>Daftar Akun — IKAPI Store Jawa Barat</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <!-- Typography: DM Sans (Hostinger Design System) & Fallback Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    :root {
      --color-primary: #673de6;
      --color-primary-hover: #5025d1;
      --color-primary-deep: #2f1c6a;
      --color-canvas: #ffffff;
      --color-surface-soft: #f5f6ff;
      --color-surface-neutral: #f5f5f6;
      --color-text-primary: #222225;
      --color-text-secondary: #62636b;
      --color-border: #e5e7eb;
    }
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        background-color: #f5f5f6;
        color: #222225;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        overflow-x: clip;
      }
      main > :first-child {
        margin-top: 0 !important;
      }
      main > :last-child {
        margin-bottom: 0 !important;
      }
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: "#673de6",
              hover: "#5025d1",
              deep: "#2f1c6a",
              container: "#673de6",
              accent: "#9d99ff"
            },
            surface: {
              DEFAULT: "#ffffff",
              soft: "#f5f6ff",
              neutral: "#f5f5f6",
              border: "#e5e7eb"
            },
            ink: {
              body: "#222225",
              muted: "#62636b",
              subtle: "#9d9ea4"
            },
            "border-subtle": "#e5e7eb",
            "border-bold": "#d1d5db"
          },
          fontFamily: {
            sans: ["'DM Sans'", "sans-serif"],
            body: ["'DM Sans'", "sans-serif"]
          },
          borderRadius: {
            '2xl': '1rem',
            '3xl': '1.5rem',
            '4xl': '1.75rem'
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface-neutral font-sans text-ink-body antialiased selection:bg-surface-soft selection:text-primary-deep min-h-screen flex items-center justify-center p-4 sm:p-6">

  <!-- MAIN CONTAINER -->
  <main class="w-full max-w-6xl mx-auto py-4">
    <div class="w-full">
      
      <!-- Unified Split-Screen Register Card (Hostinger Rounded Composition) -->
      <div class="w-full grid grid-cols-1 lg:grid-cols-12 rounded-3xl overflow-hidden shadow-xl bg-white border border-border-subtle">
        
        <!-- Left Illustration Showcase (5 Cols) with User's Reading Illustration -->
        <div class="hidden lg:flex lg:col-span-5 bg-white p-8 xl:p-12 items-center justify-center relative overflow-hidden">
          <div class="relative w-full max-w-[380px] flex items-center justify-center">
            <img src="../../assets/ilustration/auth_register_reading.png" alt="Ilustrasi Membaca E-Book IKAPI Store" class="w-full h-auto max-h-[460px] object-contain drop-shadow-sm select-none">
          </div>
        </div>

        <!-- Right Form Panel (7 Cols) with Compact & Balanced Typography -->
        <div class="col-span-1 lg:col-span-7 p-6 sm:p-10 lg:p-12 flex flex-col justify-center bg-white">
          <div class="max-w-lg w-full mx-auto space-y-6">
            
            <!-- Form Header -->
            <div class="space-y-1">
              <h1 class="text-[24px] sm:text-[26px] font-bold text-ink-body tracking-tight leading-snug">
                Buat Akun
              </h1>
              <p class="text-[14px] text-ink-muted">
                Daftar untuk membeli dan membaca e-book di IKAPI Store.
              </p>
            </div>

            <!-- Registration Form -->
            <form class="space-y-4" id="registrationForm" onsubmit="handleRegistrationSubmit(event)">
              
              <!-- Full Name (Full Width) -->
              <div class="space-y-1.5">
                <label class="block text-[13px] font-bold text-ink-body" for="fullName">
                  Nama Lengkap <span class="text-red-500">*</span>
                </label>
                <input class="w-full h-11 px-4 rounded-xl bg-surface-neutral text-ink-body text-[14px] outline-none border border-border-subtle transition-all placeholder:text-ink-muted focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20" id="fullName" name="fullName" placeholder="Contoh: Ahmad Hidayat" required type="text">
              </div>

              <!-- Grid: Email & Phone (2 Columns) -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Email -->
                <div class="space-y-1.5">
                  <label class="block text-[13px] font-bold text-ink-body" for="email">
                    Alamat Email <span class="text-red-500">*</span>
                  </label>
                  <input class="w-full h-11 px-4 rounded-xl bg-surface-neutral text-ink-body text-[14px] outline-none border border-border-subtle transition-all placeholder:text-ink-muted focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20" id="email" name="email" placeholder="nama@email.com" required type="email">
                </div>

                <!-- Phone -->
                <div class="space-y-1.5">
                  <label class="block text-[13px] font-bold text-ink-body" for="phone">
                    Nomor WhatsApp / HP <span class="text-red-500">*</span>
                  </label>
                  <input class="w-full h-11 px-4 rounded-xl bg-surface-neutral text-ink-body text-[14px] outline-none border border-border-subtle transition-all placeholder:text-ink-muted focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20" id="phone" name="phone" placeholder="0812-3456-7890" required type="tel">
                </div>
              </div>

              <!-- Grid: Passwords Row (2 Columns) -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Password -->
                <div class="space-y-1.5">
                  <label class="block text-[13px] font-bold text-ink-body" for="password">
                    Kata Sandi <span class="text-red-500">*</span>
                  </label>
                  <div class="relative flex items-center">
                    <input class="w-full h-11 pl-4 pr-10 rounded-xl bg-surface-neutral text-ink-body text-[14px] outline-none border border-border-subtle transition-all placeholder:text-ink-muted focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20" id="password" minlength="8" name="password" placeholder="Minimal 8 karakter" required type="password">
                    <button aria-label="Tampilkan kata sandi" class="absolute right-2.5 p-1 text-ink-muted hover:text-ink-body transition-colors" onclick="togglePasswordVisibility('password', 'pwdToggleIcon1')" type="button">
                      <span id="pwdToggleIcon1" class="material-symbols-outlined text-[19px]">visibility</span>
                    </button>
                  </div>
                </div>

                <!-- Password Confirmation -->
                <div class="space-y-1.5">
                  <label class="block text-[13px] font-bold text-ink-body" for="passwordConfirm">
                    Konfirmasi Kata Sandi <span class="text-red-500">*</span>
                  </label>
                  <div class="relative flex items-center">
                    <input class="w-full h-11 pl-4 pr-10 rounded-xl bg-surface-neutral text-ink-body text-[14px] outline-none border border-border-subtle transition-all placeholder:text-ink-muted focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20" id="passwordConfirm" minlength="8" name="passwordConfirm" placeholder="Ulangi kata sandi" required type="password">
                    <button aria-label="Tampilkan konfirmasi kata sandi" class="absolute right-2.5 p-1 text-ink-muted hover:text-ink-body transition-colors" onclick="togglePasswordVisibility('passwordConfirm', 'pwdToggleIcon2')" type="button">
                      <span id="pwdToggleIcon2" class="material-symbols-outlined text-[19px]">visibility</span>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Terms Checkbox -->
              <div class="pt-1">
                <label class="flex items-start gap-2.5 cursor-pointer select-none">
                  <input class="mt-0.5 w-4 h-4 rounded text-primary focus:ring-primary accent-primary cursor-pointer" id="agreeTerms" required type="checkbox">
                  <span class="text-[13px] text-ink-muted leading-relaxed">
                    Saya menyetujui 
                    <a class="text-primary font-semibold hover:underline" href="chatbot_bantuan_rekomendasi_desktop.html">Ketentuan Layanan</a> 
                    &amp; 
                    <a class="text-primary font-semibold hover:underline" href="chatbot_bantuan_rekomendasi_desktop.html">Kebijakan Privasi</a> 
                    IKAPI Store.
                  </span>
                </label>
              </div>

              <!-- Submit Button -->
              <button id="register-btn" class="w-full h-11 rounded-xl bg-primary hover:bg-primary-hover text-white text-[14px] font-bold flex items-center justify-center gap-2 transition-all shadow-xs active:scale-[0.99] cursor-pointer" type="submit">
                <span>Daftar</span>
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
              </button>
            </form>

            <!-- Divider -->
            <div class="relative flex items-center justify-center py-1">
              <div class="w-full border-t border-border-subtle"></div>
              <span class="absolute px-3 bg-white text-[12px] uppercase tracking-wider text-ink-muted font-medium">
                atau daftar dengan
              </span>
            </div>

            <!-- Google Social Auth Button -->
            <button class="w-full h-11 rounded-xl bg-white hover:bg-surface-soft text-ink-body text-[14px] font-semibold border border-border-subtle flex items-center justify-center gap-3 transition-colors shadow-xs cursor-pointer" onclick="simulateGoogleRegister()" type="button">
              <!-- Authentic Google Multi-Color SVG -->
              <svg aria-hidden="true" class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
                <path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.14z" fill="#4285F4"></path>
                <path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
                <path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
                <path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
              </svg>
              <span>Lanjutkan dengan Google</span>
            </button>

            <!-- Footer Switch Link -->
            <div class="text-center pt-1">
              <p class="text-[13px] text-ink-muted">
                Sudah punya akun? 
                <a class="text-primary hover:text-primary-hover font-semibold ml-1 hover:underline" data-path="login" href="masuk_login_desktop.html">
                  Masuk
                </a>
              </p>
            </div>

          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2.5 px-4 py-3 rounded-2xl bg-ink-body text-white shadow-xl text-[14px] font-medium border border-white/10">
    <span class="material-symbols-outlined text-primary-accent text-[20px]">check_circle</span>
    <span id="toast-message">Pendaftaran berhasil diproses</span>
  </div>

  <!-- CLIENT SCRIPT -->
  <script>
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input || !icon) return;

      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
        icon.parentElement.setAttribute('aria-label', 'Sembunyikan kata sandi');
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
        icon.parentElement.setAttribute('aria-label', 'Tampilkan kata sandi');
      }
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      if (!toast || !toastMessage) return;
      toastMessage.textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
      }, 2500);
    }

    function handleRegistrationSubmit(e) {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      const pwConfirm = document.getElementById('passwordConfirm').value;

      if (pw !== pwConfirm) {
        showToast('Kata sandi dan konfirmasi kata sandi tidak cocok');
        return false;
      }

      const btn = document.getElementById('register-btn');
      if (btn) {
        btn.disabled = true;
        const origText = btn.innerHTML;
        btn.innerHTML = `
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Mendaftarkan...</span>
        `;
        setTimeout(() => {
          showToast('Pendaftaran akun berhasil disimulasikan');
          btn.innerHTML = origText;
          btn.disabled = false;
        }, 1200);
      }
      return false;
    }

    function simulateGoogleRegister() {
      showToast('Menghubungkan ke otentikasi Google SSO...');
    }
  </script>
</body>
</html>
