<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="web_standard" name="shell-type">
  <title>Daftar Akun — IKAPI Store Jawa Barat</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
  <style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
      }
      body {
        overflow-x: clip;
      }
      main > :first-child {
        margin-top: 0 !important;
      }
      main > :last-child {
        margin-bottom: 0 !important;
      }
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-surface": "#1b1b25",
            "on-background": "#1b1b25",
            "surface-sky": "#E0F6FC",
            "surface-container": "#efecfb",
            "inverse-primary": "#c2c1ff",
            "on-primary-container": "#eeeaff",
            "on-secondary": "#ffffff",
            "background": "#fcf8ff",
            "tertiary-fixed": "#ffe08d",
            "tertiary": "#745b00",
            "surface-variant": "#e3e1ef",
            "surface-container-high": "#e9e6f5",
            "secondary-fixed-dim": "#f4b5c8",
            "ink-muted": "#555665",
            "on-tertiary-container": "#4f3d00",
            "secondary-fixed": "#ffd9e3",
            "on-tertiary": "#ffffff",
            "outline": "#777586",
            "surface-tint": "#F0EFFF",
            "on-surface-variant": "#464555",
            "on-primary": "#ffffff",
            "border-bold": "#CFD0DD",
            "tertiary-container": "#cea623",
            "error-container": "#ffdad6",
            "on-tertiary-fixed": "#241a00",
            "surface-paper": "#FFF0E3",
            "primary-fixed-dim": "#c2c1ff",
            "inverse-deep": "#24233D",
            "on-secondary-container": "#7a495a",
            "surface-container-lowest": "#ffffff",
            "border-subtle": "#E7E7EF",
            "inverse-on-surface": "#f2effe",
            "ink-body": "#191923",
            "surface-bright": "#fcf8ff",
            "surface": "#fcf8ff",
            "surface-dim": "#dbd8e7",
            "feedback-error": "#B42318",
            "inverse-surface": "#302f3a",
            "error": "#ba1a1a",
            "on-primary-fixed": "#0c006a",
            "secondary-container": "#fdbed1",
            "primary": "#3f3ad0",
            "on-tertiary-fixed-variant": "#584400",
            "surface-container-low": "#f5f2ff",
            "surface-container-highest": "#e3e1ef",
            "surface-soft": "#F8F7FF",
            "on-secondary-fixed-variant": "#663949",
            "on-primary-fixed-variant": "#3229c4",
            "primary-container": "#5956e9",
            "on-secondary-fixed": "#330e1d",
            "outline-variant": "#c7c4d7",
            "on-error-container": "#93000a",
            "surface-lilac": "#E5E4FF",
            "tertiary-fixed-dim": "#ecc23f",
            "secondary": "#815060",
            "primary-fixed": "#e2dfff",
            "on-error": "#ffffff",
            "surface-cream": "#FFF1E3"
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px"
          },
          spacing: {
            "space-3xl": "4.5rem",
            "space-xs": "0.25rem",
            "gutter-mobile": "1.25rem",
            "space-sm": "0.5rem",
            "space-lg": "1.5rem",
            "space-md": "1rem",
            "gutter": "1.5rem",
            "space-2xl": "3rem",
            "space-xl": "2rem",
            "margin": "2.5rem",
            "margin-mobile": "1.25rem"
          },
          fontFamily: {
            "body-base": ["Plus Jakarta Sans", "sans-serif"],
            "body-small": ["Plus Jakarta Sans", "sans-serif"],
            "label": ["Plus Jakarta Sans", "sans-serif"],
            "label-small": ["Plus Jakarta Sans", "sans-serif"],
            "title-md": ["Plus Jakarta Sans", "sans-serif"],
            "headline-md": ["Plus Jakarta Sans", "sans-serif"],
            "headline-lg": ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body-base text-ink-body antialiased">

  <!-- TOP HEADER -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest/95 backdrop-blur-sm shadow-[0_1px_8px_rgba(25,25,35,0.06)] h-16 flex items-center">
    <div class="max-w-7xl w-full mx-auto px-4 md:px-margin flex items-center justify-between">
      <a href="beranda_desktop.html" data-path="beranda" class="flex items-center gap-2">
        <img alt="Logo IKAPI Jawa Barat" class="h-8 w-auto object-contain" src="../../assets/logo-ikapi-jabar.png">
      </a>
      <a href="beranda_desktop.html" data-path="beranda" class="inline-flex items-center gap-1.5 font-label text-[14px] font-medium text-ink-muted hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[18px]">arrow_back</span>
        <span>Kembali ke Beranda</span>
      </a>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="w-full pt-20 bg-surface min-h-[calc(100vh-4rem)] flex flex-col justify-center">
    <div class="flex flex-col w-full">
      <div class="w-full max-w-7xl mx-auto px-4 md:px-margin py-space-xl flex-1 flex items-center justify-center">
        
        <!-- Single Card Container matching Login -->
        <div class="w-full grid grid-cols-1 lg:grid-cols-12 rounded-xl overflow-hidden shadow-xl bg-surface-container-lowest">
          
          <!-- Left Illustration Showcase (5 Cols) -->
          <div class="hidden lg:flex lg:col-span-5 bg-surface-soft p-space-xl sm:p-space-2xl items-center justify-center border-r border-border-subtle">
            <img src="../../assets/ilustration/auth_login_welcome.svg" alt="Ilustrasi Buat Akun IKAPI Store" class="w-full max-w-[360px] h-auto object-contain">
          </div>

          <!-- Right Form Panel (7 Cols) -->
          <div class="col-span-1 lg:col-span-7 p-space-xl sm:p-space-2xl md:p-space-3xl flex flex-col justify-center bg-surface-container-lowest">
            <div class="max-w-xl w-full mx-auto space-y-space-lg">
              
              <!-- Form Header -->
              <div class="space-y-space-xs">
                <h1 class="font-display-md-mobile sm:font-headline-lg text-display-md-mobile sm:text-headline-lg text-ink-body font-extrabold tracking-tight">
                  Buat Akun
                </h1>
                <p class="font-body-base text-body-base text-ink-muted">
                  Daftar untuk membeli dan membaca e-book di IKAPI Store.
                </p>
              </div>

              <!-- Registration Form -->
              <form class="space-y-space-md" id="registrationForm" onsubmit="handleRegistrationSubmit(event)">
                
                <!-- Full Name -->
                <div class="space-y-space-xs">
                  <label class="block font-label text-label text-ink-body" for="fullName">
                    Nama Lengkap <span class="text-error">*</span>
                  </label>
                  <div class="relative">
                    <input class="w-full h-12 px-space-md rounded-xl bg-surface-soft text-ink-body font-body-base text-body-base outline-none transition-all placeholder:text-outline focus:bg-surface-container-lowest focus:shadow-[0_0_0_3px_rgba(89,86,233,0.2)]" id="fullName" name="fullName" placeholder="Contoh: Ahmad Hidayat" required="" type="text">
                  </div>
                </div>

                <!-- Grid: Email & Phone -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-space-md">
                  <!-- Email -->
                  <div class="space-y-space-xs">
                    <label class="block font-label text-label text-ink-body" for="email">
                      Alamat Email <span class="text-error">*</span>
                    </label>
                    <div class="relative">
                      <input class="w-full h-12 px-space-md rounded-xl bg-surface-soft text-ink-body font-body-base text-body-base outline-none transition-all placeholder:text-outline focus:bg-surface-container-lowest focus:shadow-[0_0_0_3px_rgba(89,86,233,0.2)]" id="email" name="email" placeholder="nama@email.com" required="" type="email">
                    </div>
                  </div>

                  <!-- Phone -->
                  <div class="space-y-space-xs">
                    <label class="block font-label text-label text-ink-body" for="phone">
                      Nomor WhatsApp / HP <span class="text-error">*</span>
                    </label>
                    <div class="relative">
                      <input class="w-full h-12 px-space-md rounded-xl bg-surface-soft text-ink-body font-body-base text-body-base outline-none transition-all placeholder:text-outline focus:bg-surface-container-lowest focus:shadow-[0_0_0_3px_rgba(89,86,233,0.2)]" id="phone" name="phone" placeholder="0812-3456-7890" required="" type="tel">
                    </div>
                  </div>
                </div>

                <!-- Passwords Row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-space-md">
                  <!-- Password -->
                  <div class="space-y-space-xs">
                    <label class="block font-label text-label text-ink-body" for="password">
                      Kata Sandi <span class="text-error">*</span>
                    </label>
                    <div class="relative flex items-center">
                      <input class="w-full h-12 pl-space-md pr-11 rounded-xl bg-surface-soft text-ink-body font-body-base text-body-base outline-none transition-all placeholder:text-outline focus:bg-surface-container-lowest focus:shadow-[0_0_0_3px_rgba(89,86,233,0.2)]" id="password" minlength="8" name="password" placeholder="Minimal 8 karakter" required="" type="password">
                      <button aria-label="Lihat kata sandi" class="absolute right-3 p-1 text-ink-muted hover:text-ink-body transition-colors" onclick="togglePasswordVisibility('password', 'pwdToggleIcon1')" type="button">
                        <svg class="w-5 h-5" fill="none" id="pwdToggleIcon1" stroke="currentColor" viewBox="0 0 24 24">
                          <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                          <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        </svg>
                      </button>
                    </div>
                  </div>

                  <!-- Password Confirmation -->
                  <div class="space-y-space-xs">
                    <label class="block font-label text-label text-ink-body" for="passwordConfirm">
                      Konfirmasi Kata Sandi <span class="text-error">*</span>
                    </label>
                    <div class="relative flex items-center">
                      <input class="w-full h-12 pl-space-md pr-11 rounded-xl bg-surface-soft text-ink-body font-body-base text-body-base outline-none transition-all placeholder:text-outline focus:bg-surface-container-lowest focus:shadow-[0_0_0_3px_rgba(89,86,233,0.2)]" id="passwordConfirm" minlength="8" name="passwordConfirm" placeholder="Ulangi kata sandi" required="" type="password">
                      <button aria-label="Lihat konfirmasi kata sandi" class="absolute right-3 p-1 text-ink-muted hover:text-ink-body transition-colors" onclick="togglePasswordVisibility('passwordConfirm', 'pwdToggleIcon2')" type="button">
                        <svg class="w-5 h-5" fill="none" id="pwdToggleIcon2" stroke="currentColor" viewBox="0 0 24 24">
                          <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                          <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        </svg>
                      </button>
                    </div>
                  </div>
                </div>

                <!-- Terms Checkbox -->
                <div class="pt-space-xs">
                  <label class="flex items-start gap-space-sm cursor-pointer select-none">
                    <input class="mt-1 w-4 h-4 rounded text-primary focus:ring-primary accent-primary cursor-pointer" id="agreeTerms" required="" type="checkbox">
                    <span class="font-body-small text-body-small text-ink-muted">
                      Saya menyetujui 
                      <a class="text-primary font-label text-label hover:underline" href="#">Ketentuan Layanan</a> 
                      &amp; 
                      <a class="text-primary font-label text-label hover:underline" href="#">Kebijakan Privasi</a> 
                      IKAPI Store.
                    </span>
                  </label>
                </div>

                <!-- Submit Button -->
                <button id="register-btn" class="w-full h-12 rounded-xl bg-primary-container text-on-primary font-label text-label flex items-center justify-center gap-space-xs hover:bg-primary transition-all duration-200 shadow-md active:scale-[0.99] cursor-pointer" type="submit">
                  <span>Daftar</span>
                  <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>
              </form>

              <!-- Divider -->
              <div class="relative flex items-center justify-center py-1">
                <div class="w-full border-t border-border-subtle"></div>
                <span class="absolute px-4 bg-surface-container-lowest font-label-small text-label-small uppercase tracking-wider text-ink-muted">
                  atau daftar dengan
                </span>
              </div>

              <!-- Google Social Auth Button -->
              <button class="w-full h-12 rounded-xl bg-surface-container-low hover:bg-surface-tint text-ink-body font-label text-label flex items-center justify-center gap-3 transition-all duration-200 cursor-pointer shadow-sm" onclick="simulateGoogleRegister()" type="button">
                <!-- Authentic Google Multi-Color SVG -->
                <svg aria-hidden="true" class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
                  <path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.14z" fill="#4285F4"></path>
                  <path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
                  <path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
                  <path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
                </svg>
                <span>Lanjutkan dengan Google</span>
              </button>

              <!-- Footer Switch Link -->
              <div class="text-center pt-space-xs">
                <p class="font-body-small text-body-small text-ink-muted">
                  Sudah punya akun? 
                  <a class="font-label text-label text-primary hover:underline ml-1 font-semibold" data-path="login" href="masuk_login_desktop.html">
                    Masuk
                  </a>
                </p>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-16 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2 px-4 py-3 rounded-xl bg-ink-body text-surface shadow-lg text-[14px] font-label font-medium">
    <span class="material-symbols-outlined text-primary-fixed text-[20px]">check_circle</span>
    <span id="toast-message">Pendaftaran berhasil diproses</span>
  </div>

  <!-- SCRIPT -->
  <script>
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input || !icon) return;

      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
        `;
      } else {
        input.type = 'password';
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        `;
      }
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      if (!toast || !toastMessage) return;
      toastMessage.textContent = msg;
      toast.classList.remove('translate-y-16', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-16', 'opacity-0', 'pointer-events-none');
      }, 2500);
    }

    function handleRegistrationSubmit(e) {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      const pwConfirm = document.getElementById('passwordConfirm').value;

      if (pw !== pwConfirm) {
        showToast('Kata sandi dan konfirmasi kata sandi tidak cocok');
        return false;
      }

      const btn = document.getElementById('register-btn');
      if (btn) {
        btn.disabled = true;
        const origText = btn.innerHTML;
        btn.innerHTML = `
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Mendaftarkan...</span>
        `;
        setTimeout(() => {
          showToast('Pendaftaran akun berhasil disimulasikan');
          btn.innerHTML = origText;
          btn.disabled = false;
        }, 1500);
      }
      return false;
    }

    function simulateGoogleRegister() {
      showToast('Menghubungkan ke otentikasi Google SSO...');
    }
  </script>
</body>
</html>
