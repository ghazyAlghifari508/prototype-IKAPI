</p>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleButton && passwordInput && eyeIcon) {
      toggleButton.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    if (form) {
      form.addEventListener('submit', function() {
        const btn = document.getElementById('submitBtn');
        if (btn) {
          btn.classList.add('opacity-80');
          btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>Memproses...</span>';
          setTimeout(() => {
            btn.classList.remove('opacity-80');
            btn.innerHTML = '<span>Masuk</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
          }, 1200);
        }
      });
    }
  })();
