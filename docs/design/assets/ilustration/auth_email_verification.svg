<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="100%" height="100%">
  <defs>
    <linearGradient id="envelopeBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E4FF"/>
      <stop offset="100%" stop-color="#D1CEFF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8F7FF"/>
    </linearGradient>
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3F3AD0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background Ground / Table Plane -->
  <ellipse cx="320" cy="460" rx="260" ry="28" fill="#F0EFFF"/>
  <path d="M80 460 L560 460" stroke="#CFD0DD" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>

  <!-- Left: Stack of Editorial IKAPI Books -->
  <g transform="translate(85, 345)">
    <!-- Bottom Book (Navy) -->
    <rect x="0" y="80" width="130" height="24" rx="4" fill="#2F2E41"/>
    <rect x="8" y="84" width="116" height="16" rx="2" fill="#FFF" opacity="0.9"/>
    <rect x="116" y="80" width="14" height="24" rx="2" fill="#3F3AD0"/>
    <line x1="20" y1="92" x2="70" y2="92" stroke="#CFD0DD" stroke-width="2" stroke-linecap="round"/>

    <!-- Middle Book (Violet) -->
    <rect x="12" y="54" width="115" height="22" rx="4" fill="#4F46E5"/>
    <rect x="20" y="58" width="100" height="14" rx="2" fill="#FFF" opacity="0.95"/>
    <rect x="115" y="54" width="12" height="22" rx="2" fill="#FFB6B6"/>
    <line x1="30" y1="65" x2="75" y2="65" stroke="#CFD0DD" stroke-width="2" stroke-linecap="round"/>

    <!-- Top Book (Terracotta / Coral) -->
    <rect x="24" y="30" width="98" height="20" rx="3" fill="#815060"/>
    <rect x="30" y="33" width="86" height="14" rx="2" fill="#FFF" opacity="0.9"/>
    <!-- Ribbon Bookmark -->
    <path d="M50 30 L50 60 L55 55 L60 60 L60 30 Z" fill="#CEA623"/>
  </g>

  <!-- Center Stage: The Verification Mail Envelope & Letter -->
  <g transform="translate(190, 110)">
    
    <!-- Open Back Flap of Envelope -->
    <polygon points="20,180 140,70 260,180" fill="url(#envelopeBack)"/>

    <!-- Emerging Verification Letter / Card -->
    <g filter="url(#cardShadow)">
      <rect x="35" y="40" width="210" height="220" rx="14" fill="url(#cardGrad)" stroke="#E7E7EF" stroke-width="1.5"/>
      
      <!-- Card Header Accent -->
      <rect x="55" y="60" width="70" height="8" rx="4" fill="#3F3AD0" opacity="0.3"/>
      <circle cx="215" cy="64" r="6" fill="#FFB6B6"/>

      <!-- Verification Icon Stamp in Card -->
      <circle cx="140" cy="115" r="28" fill="url(#primaryAccent)"/>
      <!-- Checkmark -->
      <path d="M129 115 L137 123 L152 107" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Content text placeholders on letter -->
      <rect x="65" y="160" width="150" height="8" rx="4" fill="#2F2E41" opacity="0.8"/>
      <rect x="80" y="176" width="120" height="6" rx="3" fill="#555665" opacity="0.4"/>
      <rect x="95" y="190" width="90" height="6" rx="3" fill="#555665" opacity="0.3"/>
      
      <!-- Verification Link Button Graphic -->
      <rect x="85" y="212" width="110" height="22" rx="6" fill="#3F3AD0"/>
      <line x1="105" y1="223" x2="175" y2="223" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Front Body of Envelope -->
    <rect x="20" y="180" width="240" height="150" rx="8" fill="#FFFFFF" stroke="#CFD0DD" stroke-width="2"/>
    <!-- Front Side Folds of Envelope -->
    <polygon points="20,180 140,260 20,330" fill="#F5F2FF" stroke="#CFD0DD" stroke-width="1.5"/>
    <polygon points="260,180 140,260 260,330" fill="#F0EFFF" stroke="#CFD0DD" stroke-width="1.5"/>
    <!-- Front Bottom Flap Fold -->
    <polygon points="20,330 140,240 260,330" fill="#FFFFFF" stroke="#CFD0DD" stroke-width="2"/>
  </g>

  <!-- Right: Engaged Character Reading / Waiting for Verification -->
  <g transform="translate(440, 210)">
    <!-- Character Hair (Back) -->
    <path d="M60 70 C50 40, 90 20, 110 35 C130 50, 125 90, 120 105 Z" fill="#2F2E41"/>

    <!-- Torso / Yellow Mustard Sweater -->
    <path d="M45 130 C45 110, 70 100, 90 100 C110 100, 135 110, 135 130 L145 220 L35 220 Z" fill="#CEA623"/>
    <path d="M80 100 L80 130" stroke="#B58E1A" stroke-width="2"/>

    <!-- Neck & Face -->
    <rect x="82" y="80" width="16" height="22" fill="#FFB6B6"/>
    <ellipse cx="90" cy="65" rx="22" ry="26" fill="#FFB6B6"/>
    
    <!-- Character Hair (Front/Bangs) -->
    <path d="M68 55 C70 40, 95 35, 112 45 C105 52, 95 50, 85 58 Z" fill="#2F2E41"/>
    <!-- Cheerful Expression Eye & Brow -->
    <path d="M88 62 Q93 58 98 62" fill="none" stroke="#2F2E41" stroke-width="2" stroke-linecap="round"/>
    <circle cx="102" cy="70" r="3" fill="#FFA0A0"/>

    <!-- Arm reaching towards the mail -->
    <path d="M50 120 Q10 145 -15 135 Q-20 145 20 160 Q45 160 55 140 Z" fill="#CEA623"/>
    <!-- Hand -->
    <ellipse cx="-18" cy="136" rx="10" ry="7" fill="#FFB6B6" transform="rotate(-15 -18 136)"/>

    <!-- Desk legs / lower chair -->
    <rect x="55" y="220" width="70" height="40" fill="#2F2E41" rx="4"/>
    <line x1="70" y1="260" x2="65" y2="270" stroke="#2F2E41" stroke-width="6" stroke-linecap="round"/>
    <line x1="110" y1="260" x2="115" y2="270" stroke="#2F2E41" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Subtle Floating Literary Spark / Star accents (Controlled editorial style) -->
  <g fill="#3F3AD0" opacity="0.7">
    <!-- Star 1 -->
    <path d="M170 85 Q175 95 185 95 Q175 95 170 105 Q165 95 155 95 Q165 95 170 85 Z"/>
    <!-- Star 2 -->
    <path d="M475 140 Q478 147 485 147 Q478 147 475 154 Q472 147 465 147 Q472 147 475 140 Z" fill="#CEA623" opacity="0.8"/>
  </g>
</svg>