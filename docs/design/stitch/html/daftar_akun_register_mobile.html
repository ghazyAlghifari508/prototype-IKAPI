  </head><body class="bg-surface font-body-base text-body-base text-ink-body antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-gutter-mobile flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-sm"><button aria-label="Return to store" class="w-11 h-11 -ml-space-xs rounded-xl flex items-center justify-center text-on-surface hover:bg-surface-container active:scale-95 transition-all" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex items-center gap-space-sm"><span class="font-title-md text-title-md text-on-surface tracking-tight hidden xs:inline-block">IKAPI</span></div></div><div class="flex-1 text-center px-space-xs"></div></div></header><main class="flex-1 flex flex-col relative w-full px-gutter-mobile pt-16 pb-safe bg-surface"><div class="flex flex-col w-full pb-space-2xl">
<!-- Warm Literary Micro-Banner / Header -->
<div class="pt-space-md pb-space-lg flex flex-col">

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-ink-body tracking-tight">Daftar Akun Baru</h1>
<p class="font-body-small text-body-small text-ink-muted mt-space-xs">
      Lengkapi data untuk mendapatkan hak baca e-book resmi terbitan penerbit anggota IKAPI.
    </p>
</div>
<!-- Registration Form Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-space-md">
<!-- Field 1: Nama Lengkap -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-label text-ink-body flex items-center justify-between" for="fullName">
        Nama Lengkap
        <span class="text-error font-body-small">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface-container-low text-ink-body font-body-base text-body-base px-space-md rounded-lg focus:outline-none focus:bg-surface-soft transition-all duration-150 placeholder:text-outline" id="fullName" placeholder="Nama Anda" required="" type="text">
<span class="material-symbols-outlined absolute right-3.5 text-outline text-[20px] pointer-events-none">badge</span>
</div>
</div>
<!-- Field 2: Alamat Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-label text-ink-body flex items-center justify-between" for="email">
        Alamat Email
        <span class="text-error font-body-small">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface-container-low text-ink-body font-body-base text-body-base px-space-md rounded-lg focus:outline-none focus:bg-surface-soft transition-all duration-150 placeholder:text-outline" id="email" placeholder="email@domain.com" required="" type="email">
<span class="material-symbols-outlined absolute right-3.5 text-outline text-[20px] pointer-events-none">mail</span>
</div>
</div>
<!-- Field 3: Nomor HP (WhatsApp) -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-label text-ink-body flex items-center justify-between" for="phone">
        Nomor HP (WhatsApp)
        <span class="text-error font-body-small">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface-container-low text-ink-body font-body-base text-body-base px-space-md rounded-lg focus:outline-none focus:bg-surface-soft transition-all duration-150 placeholder:text-outline" id="phone" inputmode="numeric" placeholder="08xxxxxxxxxx" required="" type="tel">
<span class="material-symbols-outlined absolute right-3.5 text-outline text-[20px] pointer-events-none">phone_iphone</span>
</div>
</div>
<!-- Field 4: Kata Sandi -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-label text-ink-body flex items-center justify-between" for="password">
        Kata Sandi
        <span class="text-error font-body-small">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface-container-low text-ink-body font-body-base text-body-base pl-space-md pr-12 rounded-lg focus:outline-none focus:bg-surface-soft transition-all duration-150 placeholder:text-outline" id="password" placeholder="Minimal 8 karakter" required="" type="password">
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute right-0 h-12 w-12 flex items-center justify-center text-ink-muted hover:text-ink-body focus:outline-none active:scale-95 transition-transform" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon1">visibility</span>
</button>
</div>
</div>
<!-- Field 5: Konfirmasi Kata Sandi -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-label text-ink-body flex items-center justify-between" for="confirmPassword">
        Konfirmasi Kata Sandi
        <span class="text-error font-body-small">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface-container-low text-ink-body font-body-base text-body-base pl-space-md pr-12 rounded-lg focus:outline-none focus:bg-surface-soft transition-all duration-150 placeholder:text-outline" id="confirmPassword" placeholder="Ulangi kata sandi" required="" type="password">
<button aria-label="Tampilkan atau sembunyikan konfirmasi kata sandi" class="absolute right-0 h-12 w-12 flex items-center justify-center text-ink-muted hover:text-ink-body focus:outline-none active:scale-95 transition-transform" id="toggleConfirmPassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon2">visibility</span>
</button>
</div>
</div>
<!-- Agreement Checkbox -->
<div class="pt-space-xs">
<label class="flex items-start gap-space-sm select-none cursor-pointer group">
<input class="peer sr-only" id="termsCheck" type="checkbox">
<div class="w-5 h-5 rounded bg-surface-container-high peer-checked:bg-primary flex items-center justify-center transition-all duration-150 mt-0.5 flex-shrink-0 group-hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<span class="font-body-small text-body-small text-ink-muted leading-tight">
          Saya menyetujui <a class="text-primary font-label text-label hover:underline" href="javascript:void(0)">Ketentuan Penggunaan</a> &amp; <a class="text-primary font-label text-label hover:underline" href="javascript:void(0)">Privasi</a>
</span>
</label>
</div>
<!-- Primary Action: Daftar Sekarang -->
<button class="w-full h-12 rounded-lg bg-primary-container text-on-primary font-label text-label shadow-sm hover:bg-primary active:scale-[0.99] transition-all flex items-center justify-center gap-space-xs mt-space-xs" id="submitRegistration" type="button">
<span>Daftar Sekarang</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<!-- Editorial Warm Break & Divider -->
<div class="flex items-center gap-space-md my-space-lg px-space-xs">
<div class="flex-1 h-px bg-surface-container-high"></div>
<span class="font-label-small text-label-small text-outline uppercase tracking-wider">atau</span>
<div class="flex-1 h-px bg-surface-container-high"></div>
</div>
<!-- Secondary CTA: Google Auth -->
<button class="w-full h-12 bg-surface-container-lowest text-ink-body font-label text-label rounded-lg flex items-center justify-center gap-space-sm shadow-sm active:scale-[0.99] hover:bg-surface-container-low transition-all" type="button">
<svg aria-hidden="true" class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17Z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15Z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z" fill="#EA4335"></path>
</svg>
<span>Lanjutkan dengan Google</span>
</button>
<!-- Physical Book Quote / Value Callout -->

<!-- Bottom Navigation Link -->
<div class="text-center mt-space-xl">
<p class="font-body-small text-body-small text-ink-muted">
      Sudah punya akun?
      <a class="text-primary font-label text-label ml-1 hover:underline inline-flex items-center gap-0.5" href="javascript:void(0)">
<span>Masuk</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
</a>
</p>
</div>
</div>
<script>
  (function() {
    const setupPasswordToggle = (inputId, buttonId, iconId) => {
      const input = document.getElementById(inputId);
      const button = document.getElementById(buttonId);
      const icon = document.getElementById(iconId);

      if (input && button && icon) {
        button.addEventListener('click', () => {
          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          icon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
      }
    };

    setupPasswordToggle('password', 'togglePassword', 'eyeIcon1');
    setupPasswordToggle('confirmPassword', 'toggleConfirmPassword', 'eyeIcon2');

    const submitBtn = document.getElementById('submitRegistration');
    const termsCheck = document.getElementById('termsCheck');
    
    if (submitBtn) {
      submitBtn.addEventListener('click', (e) => {
        if (!termsCheck.checked) {
          termsCheck.parentElement.classList.add('animate-pulse');
          setTimeout(() => {
            termsCheck.parentElement.classList.remove('animate-pulse');
          }, 800);
        }
      });
    }
  })();
</script></main>



</body></html>
