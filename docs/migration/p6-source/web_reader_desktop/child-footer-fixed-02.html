<footer aria-label="Kontrol Membaca &amp; Navigasi Halaman" class="fixed bottom-0 left-0 w-full theme-chrome border-t px-4 sm:px-6 py-2.5 z-40 transition-colors duration-300 shadow-xs font-sans">
    <div class="max-w-3xl mx-auto flex flex-col gap-1.5">
      
      <!-- Navigation Row -->
      <div class="flex items-center justify-between gap-4">
        <!-- Prev Button -->
        <button id="btn-prev-page" type="button" class="inline-flex items-center gap-1 text-[13px] font-bold theme-text hover:text-primary transition-colors py-1.5 px-3 rounded-xl hover:bg-black/5 dark:hover:bg-white/5 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer" onclick="changePage(-1)">
          <span class="material-symbols-outlined text-[18px]">chevron_left</span>
          <span class="hidden sm:inline">Sebelumnya</span>
        </button>

        <!-- Center Counter Status -->
        <div class="flex items-center gap-2 text-center">
          <span id="page-indicator" class="font-bold text-[13px] sm:text-[14px] theme-text">
            Halaman 41 dari 44
          </span>
          <span id="progress-percent" class="text-[12px] font-bold text-primary">
            (16% dari buku)
          </span>
        </div>

        <!-- Next Button -->
        <button id="btn-next-page" type="button" class="inline-flex items-center gap-1 text-[13px] font-bold theme-text hover:text-primary transition-colors py-1.5 px-3 rounded-xl hover:bg-black/5 dark:hover:bg-white/5 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer" onclick="changePage(1)">
          <span class="hidden sm:inline">Berikutnya</span>
          <span class="material-symbols-outlined text-[18px]">chevron_right</span>
        </button>
      </div>

      <!-- Scrubbable Progress Bar -->
      <div class="w-full flex items-center gap-2.5 pt-0.5">
        <span id="progress-min-label" class="text-[11px] font-mono theme-muted">41</span>
        <div class="relative flex-1 h-2 bg-black/10 dark:bg-white/10 rounded-full overflow-hidden cursor-pointer" onclick="handleScrub(event)">
          <div id="progress-bar-fill" class="h-full bg-primary rounded-full transition-all duration-300" style="width: 25%;"></div>
        </div>
        <span id="progress-max-label" class="text-[11px] font-mono theme-muted">44</span>
      </div>

    </div>
  </footer>
